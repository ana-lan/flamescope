# Render Blueprint for the IgnitIQ API (FastAPI in Docker, free plan).
services:
  - type: web
    name: ignit-iq
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ASK_CONCURRENCY
        value: "2"